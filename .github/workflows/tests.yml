name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only PyTorch keeps the job small)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest --html=results/test_report.html --self-contained-html --cov=rasherqc --cov-report=term
      - name: Build API documentation
        run: pdoc src/rasherqc -o docs/api --docformat google
      - uses: actions/upload-artifact@v4
        with:
          name: test-report-and-docs
          path: |
            results/test_report.html
            docs/api
