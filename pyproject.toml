[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rasherqc"
version = "1.0.0"
description = "Detection of pork-rasher packaging and meat-placement defects with tray PASS/FAIL decision (MMA3001 individual project)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "torch>=2.1",
    "ultralytics>=8.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-html>=4.0", "pytest-cov>=4.1", "pdoc>=14.0", "thop>=0.1.1", "nbclient", "nbformat", "ipykernel"]

[project.scripts]
rasherqc = "rasherqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
